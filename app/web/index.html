<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOC Syslog</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231f4e79'/%3E%3Cpath d='M20 12h-3l-2.5 6.5L9.5 5.5 7 12H4' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Pantalla de inicio de sesión (se muestra si no hay sesión) -->
  <div id="login" hidden></div>

  <div id="app" hidden>
  <!-- Barra superior: sistema, entorno y usuario de la sesión -->
  <header class="topbar">
    <div class="marca">
      <span class="logo" id="logo"></span>
      <div>
        <strong>NOC Syslog</strong>
        <small>Centro de operaciones de red</small>
      </div>
    </div>
    <span class="entorno" title="Los equipos y eventos de este laboratorio no son reales">Entorno de laboratorio · datos simulados</span>
    <!-- Usuario de la sesión, su rol y acciones de cuenta -->
    <div class="usuario" id="usuario-sesion"></div>
  </header>

  <div class="layout">
    <!-- Menú lateral, agrupado en el orden en que se trabaja -->
    <nav class="menu" id="menu" aria-label="Secciones"></nav>

    <!-- Aquí se dibuja la vista activa -->
    <main id="vista" tabindex="-1"></main>
  </div>

  </div>

  <!-- Mensajes emergentes (éxito / error) -->
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
